name: Bug report
description: Something in the starter does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — see [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the request, command or test that triggers the problem.
      placeholder: |
        1. Run `composer run serve`
        2. Send `curl ...`
        3. Observe ...
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.3.10"
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database driver
      options:
        - MySQL
        - MariaDB
        - SQLite
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Remove any credentials or tokens before pasting.
      render: shell
    validations:
      required: false
