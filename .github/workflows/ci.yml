name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality gates and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, curl, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-8.3-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate, analyse and lint
        run: composer run check

      - name: Run tests
        run: composer run test
