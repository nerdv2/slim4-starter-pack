openapi: 3.0.0
info:
  title: 'Slim 4 Starter Pack'
  description: 'Backend API for the Slim 4 Starter Pack, please use responsibly.'
  contact:
    email: admin@example.com
  version: v1.0.0
paths:
  /customer:
    get:
      tags:
        - Customer
      summary: 'List customers'
      description: 'Retrieve a paginated customer list with optional keyword search.'
      operationId: 40b7f7503eba97a0c6399d9ef21c7e12
      parameters:
        -
          name: page
          in: query
          description: 'Page number (1-based)'
          schema:
            type: integer
            default: 1
        -
          name: limit
          in: query
          description: 'Rows per page (max 100)'
          schema:
            type: integer
            default: 20
        -
          name: keywords
          in: query
          description: 'Case-insensitive name search'
          schema:
            type: string
            default: ''
      responses:
        '200':
          description: Success
  /customer/add:
    post:
      tags:
        - Customer
      summary: 'Create customer'
      description: 'Create a customer. Requires an admin token.'
      operationId: 867eea20c068a227fbe1205518f2e61d
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - name
              properties:
                name:
                  description: 'Customer name'
                  type: string
              type: object
      responses:
        '200':
          description: Success
        '400':
          description: 'Validation failed'
        '401':
          description: 'Missing or invalid token'
        '403':
          description: 'Access denied'
      security:
        -
          auth_token: []
  /customer/update:
    post:
      tags:
        - Customer
      summary: 'Update customer'
      description: 'Rename a customer. Requires an admin token.'
      operationId: 9f19530c46fd84f8d843e55f604a23d8
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - id
                - name
              properties:
                id:
                  description: 'Customer id'
                  type: integer
                name:
                  description: 'Customer name'
                  type: string
              type: object
      responses:
        '200':
          description: Success
        '400':
          description: 'Validation failed'
        '401':
          description: 'Missing or invalid token'
        '403':
          description: 'Access denied'
      security:
        -
          auth_token: []
  /customer/delete:
    delete:
      tags:
        - Customer
      summary: 'Delete customer'
      description: 'Delete a customer. Requires an admin token.'
      operationId: f7369b083d75d0520aa3f8ae9becb0ed
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - id
              properties:
                id:
                  description: 'Customer id'
                  type: integer
              type: object
      responses:
        '200':
          description: Success
        '400':
          description: 'Validation failed'
        '401':
          description: 'Missing or invalid token'
        '403':
          description: 'Access denied'
      security:
        -
          auth_token: []
  /:
    get:
      tags:
        - Default
      summary: 'Application status'
      description: 'Application name and active version.'
      operationId: bb83ade5a3e703625a5f77635b32f245
      responses:
        '200':
          description: Success
  /status:
    get:
      tags:
        - Default
      summary: 'Application status payload'
      description: 'Retrieves application status and active version.'
      operationId: 2f1d27cd57d1fe6e5ae4db2202c78875
      responses:
        '200':
          description: Success
  /swaggerui:
    get:
      tags:
        - Default
      summary: 'API documentation UI'
      description: 'Bundled Swagger UI for the generated OpenAPI specification.'
      operationId: 92f116eb8e435cd737089f9bedb5b8d7
      responses:
        '200':
          description: 'HTML page'
components:
  securitySchemes:
    auth_token:
      type: apiKey
      description: "JWT issued by the application; send the raw token or 'Bearer <token>'."
      name: Authorization
      in: header
tags:
  -
    name: Customer
    description: Customer
  -
    name: Default
    description: Default
