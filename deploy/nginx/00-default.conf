# HTTP-only default server; TLS is terminated by the ingress/reverse proxy.
server {
    listen 80 reuseport default_server;
    listen [::]:80 reuseport default_server;

    server_name localhost;

    # Load extra configuration such as the application root and security rules.
    include /etc/nginx/custom.d/*.conf;

    # index.php fallback for clean routes.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
}
